name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p /tmp/gradle-dl
            curl -fsSL --retry 3 -o /tmp/gradle-dl/gradle.zip \
              "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
            (cd /tmp/gradle-dl && unzip -q gradle.zip)
            cp -v /tmp/gradle-dl/gradle-8.7/lib/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar
            rm -rf /tmp/gradle-dl
          fi
          [ -s gradle/wrapper/gradle-wrapper.jar ] || { echo "ERROR: gradle-wrapper.jar 不存在"; exit 1; }
          chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build Release APK + Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p /tmp/gradle-dl
            curl -fsSL --retry 3 -o /tmp/gradle-dl/gradle.zip \
              "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
            (cd /tmp/gradle-dl && unzip -q gradle.zip)
            cp -v /tmp/gradle-dl/gradle-8.7/lib/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar
            rm -rf /tmp/gradle-dl
          fi
          [ -s gradle/wrapper/gradle-wrapper.jar ] || { echo "ERROR: gradle-wrapper.jar 不存在"; exit 1; }
          chmod +x ./gradlew

      - name: Derive Android signing keystore from GitHub OIDC token
        id: android_signing
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?ACTIONS_ID_TOKEN_REQUEST_TOKEN 不存在}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?ACTIONS_ID_TOKEN_REQUEST_URL 不存在}"
          OIDC_TOKEN=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: 无法从 Actions 获取 OIDC token"
            exit 1
          fi

          SEED_MATERIAL="mepass-keystore-pw-v1|${OIDC_TOKEN}|${GITHUB_REF}|${GITHUB_REPOSITORY}"
          KEYSTORE_PW=$(printf "%s" "$SEED_MATERIAL" | sha256sum | awk '{print $1}')
          KEY_PW="$KEYSTORE_PW"
          KEY_ALIAS="mepass_release"

          KEY_SEED_HEX=$(printf "%s" "mepass-android-key-seed-v1" | \
            openssl dgst -sha256 -mac HMAC -macopt hexkey:"$KEYSTORE_PW" -r | awk '{print $1}')

          RANDFILE=$(mktemp)
          (printf "%s" "$KEY_SEED_HEX"; printf "%s" "$KEYSTORE_PW" | sha256sum | awk '{print $1}') > "$RANDFILE"
          while [ $(stat -c%s "$RANDFILE") -lt 4096 ]; do
            cat "$RANDFILE" "$RANDFILE" > "${RANDFILE}.2" && mv "${RANDFILE}.2" "$RANDFILE" 2>/dev/null || break
          done

          WORKDIR=$(pwd)
          KEYSTORE_PATH="$WORKDIR/mepass_release_keystore.jks"
          rm -f "$KEYSTORE_PATH"

          PWTMP=$(mktemp)
          printf "%s" "$KEYSTORE_PW" > "$PWTMP"

          DN_NAME="CN=MePass Release, OU=MePass Open Source, O=MePass, L=Global, ST=Global, C=AA"

          export _JAVA_OPTIONS="-Djava.security.egd=file://$RANDFILE -Dsecurerandom.source=file://$RANDFILE"
          (umask 077 && \
            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 \
              -validity 10950 \
              -dname "$DN_NAME" \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -storepass:file "$PWTMP" \
              -keypass:file  "$PWTMP" \
              -noprompt 2>&1) > /tmp/kt_gen.log || {
            echo "ERROR: keytool -genkeypair 失败"
            cat /tmp/kt_gen.log
            rm -f "$PWTMP" "$RANDFILE" /tmp/kt_gen.log
            exit 1
          }
          unset _JAVA_OPTIONS

          keytool -list -keystore "$KEYSTORE_PATH" -storepass:file "$PWTMP" >/dev/null
          echo "[verify OK] JKS keystore 生成成功"

          echo "MEPASS_RELEASE_STORE_FILE=$KEYSTORE_PATH"     >> "$GITHUB_ENV"
          echo "MEPASS_RELEASE_STORE_PASSWORD=$KEYSTORE_PW"    >> "$GITHUB_ENV"
          echo "MEPASS_RELEASE_KEY_ALIAS=$KEY_ALIAS"            >> "$GITHUB_ENV"
          echo "MEPASS_RELEASE_KEY_PASSWORD=$KEY_PW"            >> "$GITHUB_ENV"

          rm -f "$PWTMP" "$RANDFILE"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Signing
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -1d "$SDK_ROOT/build-tools"/*/ 2>/dev/null | sort -V | tail -1)
          APKSIGNER="${BT_DIR}apksigner"
          ZIPALIGN="${BT_DIR}zipalign"

          echo "=== 验证 Release APK 签名 ==="
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk 2>&1

          echo "=== 验证 Release APK zipalign ==="
          "$ZIPALIGN" -c -v 4 app/build/outputs/apk/release/app-release.apk 2>&1 | tail -3

          echo "=== 验证 Debug APK 签名 ==="
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk 2>&1

      - name: Collect release artifacts
        run: |
          set -e
          mkdir -p release_out
          cp -v app/build/outputs/apk/release/app-release.apk release_out/app-release.apk
          cp -v app/build/outputs/apk/debug/app-debug.apk release_out/app-debug.apk
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp -v app/build/outputs/mapping/release/mapping.txt release_out/mapping.txt
          fi
          ls -lah release_out/

      - name: Generate SHA-256 Checksums
        run: |
          cd release_out
          for f in *.apk mapping.txt; do
            if [ -f "$f" ]; then
              sha256sum "$f" | tee -a SHA256SUMS.txt
            fi
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_out/*.apk
            release_out/SHA256SUMS.txt
            release_out/mapping.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
